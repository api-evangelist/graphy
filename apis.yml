aid: graphy
name: Graphy
description: >-
  Graphy is an AI-powered data visualization platform that turns raw data into presentation-ready
  charts and interactive data stories. Alongside its no-code chart maker (Google Sheets, CSV and
  Excel import, AI insights, conversational data chat and 20+ chart types), Graphy ships a developer
  platform at graphy.dev: an AI Agents API that generates, mutates, annotates, narrates, extracts
  and deterministically evaluates charts from natural language — streamed as Server-Sent Events —
  plus a React charting SDK and editor for embedding editable, story-driven data experiences inside
  your own product. Backed by Seedcamp, Coatue, General Catalyst and Northzone.
